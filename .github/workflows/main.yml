name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publikacja APK w zakładce Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DriveMonitor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Stały link do najnowszej wersji (do otwarcia na telefonie):
      # https://github.com/cannonadestudio/drive_monitor/releases/latest/download/DriveMonitor.apk
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriveMonitor.apk
          gh release create "build-${{ github.run_number }}" DriveMonitor.apk \
            --title "DriveMonitor – build ${{ github.run_number }}" \
            --notes "Automatyczny build z commita ${{ github.sha }}. Pobierz DriveMonitor.apk i zainstaluj na telefonie." \
            --latest
