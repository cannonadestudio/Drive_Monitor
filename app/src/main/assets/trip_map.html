<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trasa</title>
<style>
  :root {
    --bg: rgba(255,255,255,.94); --fg: #1d2125; --muted: #626a73; --line: #dfe3e8;
    --accent: #1a73e8; --on-accent: #fff; --chip: #eef1f4;
    --ok: #2e9e5b; --c1: #e0b400; --c2: #f08a24; --c3: #e0412b; --c4: #8e1b6d; --na: #9aa0a6;
    --ground: #e8ece6; --grid: rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: rgba(28,31,35,.94); --fg: #eceff2; --muted: #9aa3ad; --line: #3a4048; --chip: #2c3138;
            --accent: #8ab4f8; --on-accent: #0b1d3a; --ground: #15191c; --grid: rgba(255,255,255,.06); }
    .card { border: 1px solid var(--line); }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.35 system-ui, -apple-system, Roboto, sans-serif; color: var(--fg); background: var(--ground); }
  #map, #track2d { position: absolute; inset: 0; width: 100%; height: 100%; }
  #track2d { background: var(--ground); touch-action: none; }
  .card { background: var(--bg); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.18); backdrop-filter: blur(6px); }

  #stats { position: absolute; top: 10px; left: 10px; right: 10px; padding: 10px 12px; }
  #stats .row { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  #stats .k { font-size: 11px; color: var(--muted); }
  #stats .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  #legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 4px; border-radius: 2px; margin-right: 4px; vertical-align: middle; background: var(--c); }

  #mapStatus { position: absolute; left: 10px; max-width: 58%; padding: 6px 10px; font-size: 12px; color: var(--muted); display: none; }
  #hud { position: absolute; top: 120px; right: 10px; padding: 8px 10px; text-align: right; display: none; }
  #hud .speed { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #hud .unit { font-size: 12px; color: var(--muted); }
  #limitSign { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    border: 5px solid #d32f2f; background: #fff; color: #111; font-weight: 700; margin-top: 6px; box-sizing: border-box; }
  #hud .meta { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  #hud.over .speed { color: var(--c3); }

  #panel { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 12px 12px; }
  #profile { width: 100%; height: 86px; display: block; touch-action: none; }
  #controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 7px 12px; background: var(--chip); color: var(--fg); }
  button.on { background: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .4; }
  #play { width: 44px; height: 44px; padding: 0; font-size: 18px; background: var(--accent); color: var(--on-accent); flex: none; }
  #speeds { display: flex; gap: 4px; flex-wrap: wrap; }
  #speeds button { padding: 6px 9px; font-size: 12px; }
  #mode { margin-left: auto; flex: none; }
  #clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; display: flex; justify-content: space-between; }

  #resetView { position: absolute; left: 10px; display: none; padding: 8px 12px; font-weight: 600; bottom: 210px; }
  .car { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25), 0 2px 6px rgba(0,0,0,.35); }
  /* podgląd na ekranie głównym: sama mapa z trasą */
  .preview #stats, .preview #panel, .preview #hud, .preview #resetView, .preview .maplibregl-ctrl-attrib { display: none !important; }
  .preview #mapStatus { top: 8px !important; left: 8px; font-size: 11px; padding: 4px 8px; }
  #error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="track2d"></canvas>

<div id="stats" class="card">
  <div class="row" id="statRow"></div>
  <div id="legend">
    <span style="--c:var(--ok)">w limicie</span>
    <span style="--c:var(--c1)">+0–10</span>
    <span style="--c:var(--c2)">+10–20</span>
    <span style="--c:var(--c3)">+20–30</span>
    <span style="--c:var(--c4)">&gt;+30</span>
    <span style="--c:var(--na)">brak limitu</span>
  </div>
</div>

<div id="mapStatus" class="card"></div>

<div id="hud" class="card">
  <div class="speed" id="hudSpeed">0</div><div class="unit">km/h</div>
  <div id="limitSign">–</div>
  <div class="meta" id="hudEle"></div>
</div>

<div id="panel" class="card">
  <canvas id="profile"></canvas>
  <div id="clock"><span id="tNow">00:00</span><span id="tDist">0,0 km</span><span id="tEnd">00:00</span></div>
  <div id="controls">
    <button id="play" aria-label="Odtwórz">▶</button>
    <div id="speeds"></div>
    <button id="mode" disabled>3D</button>
  </div>
</div>

<button id="resetView" class="card">⟲ Za autem</button>
<div id="error"></div>

<script>
'use strict';
const COLORS = { na: '#9aa0a6', ok: '#2e9e5b', c1: '#e0b400', c2: '#f08a24', c3: '#e0412b', c4: '#8e1b6d' };
const SPEEDS = [10, 30, 60, 120, 300];
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.documentElement.classList.add('preview');
const LIBS = [
  'maplibre/maplibre-gl',   // wbudowana w aplikację (pobierana przy budowaniu APK)
  'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl',
  'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl',
];

function showError(msg) {
  const el = document.getElementById('error');
  el.style.display = 'grid';
  el.textContent = msg;
}
function setStatus(msg) {
  const el = document.getElementById('mapStatus');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg || '';
}
window.addEventListener('error', e => {
  console.error('JS error:', e.message, 'linia', e.lineno);
  if (!window.__uiReady) showError('Błąd ekranu trasy: ' + e.message);
});

// Dane trasy: najpierw z adresu obsługiwanego przez aplikację, awaryjnie z mostka JS.
async function loadTrip() {
  try {
    const r = await fetch('/data/trip.json', { cache: 'no-store' });
    if (r.ok) return await r.json();
    console.warn('trip.json HTTP', r.status);
  } catch (e) { console.warn('trip.json niedostępny:', e.message); }
  try { if (window.Android) return JSON.parse(Android.getTrip()); } catch (e) { console.warn('Mostek JS:', e.message); }
  return { points: [] };
}

loadTrip().then(initUI).catch(e => showError('Nie udało się wczytać trasy: ' + e.message));

function initUI(trip) {
  const P = trip.points || [];   // [lon, lat, ele, speed, limit, t]
  if (P.length < 2) {
    showError(trip.error ? 'Nie udało się odczytać trasy: ' + trip.error
      : `Ta trasa ma za mało punktów, by ją pokazać (${P.length}).`);
    return;
  }

  // ---------- obliczenia ----------
  const cat = p => {
    if (p[4] == null) return 'na';
    const over = p[3] - p[4];
    return over <= 0 ? 'ok' : over <= 10 ? 'c1' : over <= 20 ? 'c2' : over <= 30 ? 'c3' : 'c4';
  };
  const toRad = d => d * Math.PI / 180;
  function distM(a, b) {
    const R = 6371000, dLat = toRad(b[1] - a[1]), dLon = toRad(b[0] - a[0]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function bearing(a, b) {
    const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
    const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) - Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  const D = [0];
  for (let i = 1; i < P.length; i++) D.push(D[i - 1] + distM(P[i - 1], P[i]));
  const T = P.map(p => p[5]);
  const totalT = Math.max(T[T.length - 1], 0.001), totalD = Math.max(D[D.length - 1], 0.001);

  const hasEle = P.filter(p => p[2] != null).length > P.length * 0.8;
  let E = [], gain = 0, loss = 0, eMin = 0, eMax = 0;
  if (hasEle) {
    let last = null;
    E = P.map(p => (last = p[2] ?? last));
    const W = 5;
    E = E.map((_, i) => {
      let s = 0, n = 0;
      for (let j = Math.max(0, i - W); j <= Math.min(E.length - 1, i + W); j++) if (E[j] != null) { s += E[j]; n++; }
      return n ? s / n : 0;
    });
    let ref = E[0];
    for (const e of E) {
      if (e - ref > 3) { gain += e - ref; ref = e; }
      else if (ref - e > 3) { loss += ref - e; ref = e; }
    }
    eMin = Math.min(...E); eMax = Math.max(...E);
  }

  // ---------- statystyki ----------
  const fmt = (v, d = 0) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('pl-PL', { maximumFractionDigits: d, minimumFractionDigits: d });
  const dur = sec => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60;
    return h ? `${h} h ${String(m).padStart(2, '0')} min ${String(s2).padStart(2, '0')} s`
      : m ? `${m} min ${String(s2).padStart(2, '0')} s` : `${s2} s`;
  };
  const hhmm = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${String(m).padStart(2, '0')} h` : `${m}:${String(s % 60).padStart(2, '0')}`; };
  const S = trip.stats || {};
  // podział dystansu na kategorie liczony z punktów trasy
  const catKm = { na: 0, ok: 0, c1: 0, c2: 0, c3: 0, c4: 0 };
  for (let i = 1; i < P.length; i++) catKm[cat(P[i])] += (D[i] - D[i - 1]) / 1000;
  const overKm = catKm.c1 + catKm.c2 + catKm.c3 + catKm.c4;
  const statItems = [
    ['Dystans', fmt(totalD / 1000, 1) + ' km'],
    ['Czas', dur(totalT)],
    ['Max', fmt(S.maxSpeedKmh ?? Math.max(...P.map(p => p[3]))) + ' km/h'],
    ['W limicie', `<span style="color:var(--ok)">${fmt(catKm.ok, 1)} km</span>`],
    ['Ponad limitem', `<span style="color:var(--c3)">${fmt(overKm, 1)} km</span>`],
    ['Bez limitu', fmt(catKm.na, 1) + ' km'],
    ['Hamowania', S.harshBrakes ?? '–'],
  ];
  if (hasEle) statItems.push(['↑ / ↓', `${fmt(gain)} / ${fmt(loss)} m`], ['Wys.', `${fmt(eMin)}–${fmt(eMax)} m`]);
  document.getElementById('statRow').innerHTML =
    statItems.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const hud = document.getElementById('hud');
  function placeOverlays() {
    const top = document.getElementById('stats').offsetHeight + 18;
    hud.style.top = top + 'px';
    document.getElementById('mapStatus').style.top = top + 'px';
  }
  placeOverlays();

  // ---------- widok uproszczony (działa zawsze, także bez internetu) ----------
  const c2d = document.getElementById('track2d');
  const g2d = c2d.getContext('2d');
  const routeLayer = document.createElement('canvas');
  let proj = null;   // funkcja lon/lat -> piksele

  function layout2D() {
    const dpr = window.devicePixelRatio || 1;
    const w = c2d.clientWidth, h = c2d.clientHeight;
    // WebView potrafi uruchomić stronę, zanim dostanie rozmiar – wtedy czekamy na ResizeObserver
    if (w < 10 || h < 10) { proj = null; return; }
    c2d.width = routeLayer.width = w * dpr;
    c2d.height = routeLayer.height = h * dpr;

    // projekcja Mercatora dopasowana do obszaru między kartą statystyk a panelem
    const mx = lon => toRad(lon);
    const my = lat => Math.log(Math.tan(Math.PI / 4 + toRad(lat) / 2));
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of P) { const x = mx(p[0]), y = my(p[1]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const top = document.getElementById('stats').offsetHeight + 30;
    const bottom = h - document.getElementById('panel').offsetHeight - 30;
    const left = 30, right = w - 30;
    const sx = (right - left) / Math.max(x1 - x0, 1e-9), sy = (bottom - top) / Math.max(y1 - y0, 1e-9);
    const s = Math.min(sx, sy);
    const ox = left + ((right - left) - (x1 - x0) * s) / 2, oy = top + ((bottom - top) - (y1 - y0) * s) / 2;
    proj = (lon, lat) => [(ox + (mx(lon) - x0) * s) * dpr, (oy + (y1 - my(lat)) * s) * dpr];

    // trasa rysowana raz do bufora
    const g = routeLayer.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    g.clearRect(0, 0, routeLayer.width, routeLayer.height);
    g.strokeStyle = css.getPropertyValue('--grid'); g.lineWidth = 1;
    const step = 40 * dpr;
    for (let x = 0; x < routeLayer.width; x += step) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, routeLayer.height); g.stroke(); }
    for (let y = 0; y < routeLayer.height; y += step) { g.beginPath(); g.moveTo(0, y); g.lineTo(routeLayer.width, y); g.stroke(); }
    g.lineJoin = g.lineCap = 'round';
    g.strokeStyle = '#ffffff'; g.lineWidth = 8 * dpr;
    g.beginPath(); P.forEach((p, i) => { const [x, y] = proj(p[0], p[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    g.lineWidth = 4.5 * dpr;
    for (let i = 1; i < P.length; i++) {
      const [xa, ya] = proj(P[i - 1][0], P[i - 1][1]), [xb, yb] = proj(P[i][0], P[i][1]);
      g.strokeStyle = COLORS[cat(P[i])];
      g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.stroke();
    }
    const dot = (p, fill) => { const [x, y] = proj(p[0], p[1]); g.fillStyle = fill; g.strokeStyle = '#fff'; g.lineWidth = 2.5 * dpr; g.beginPath(); g.arc(x, y, 7 * dpr, 0, 7); g.fill(); g.stroke(); };
    dot(P[0], '#2e9e5b'); dot(P[P.length - 1], '#1d2125');
  }

  function draw2D(s) {
    if (!proj || !routeLayer.width || !routeLayer.height) return;
    const dpr = window.devicePixelRatio || 1;
    g2d.clearRect(0, 0, c2d.width, c2d.height);
    g2d.drawImage(routeLayer, 0, 0);
    if (PREVIEW) return;
    const [x, y] = proj(s.lon, s.lat);
    g2d.fillStyle = 'rgba(26,115,232,.25)'; g2d.beginPath(); g2d.arc(x, y, 15 * dpr, 0, 7); g2d.fill();
    g2d.fillStyle = '#1a73e8'; g2d.strokeStyle = '#fff'; g2d.lineWidth = 3 * dpr;
    g2d.beginPath(); g2d.arc(x, y, 8 * dpr, 0, 7); g2d.fill(); g2d.stroke();
  }

  // ---------- stan w czasie ----------
  function sampleAt(t) {
    let lo = 0, hi = T.length - 1;
    if (t <= T[0]) return { i: 0, f: 0 };
    if (t >= T[hi]) return { i: hi - 1, f: 1 };
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
    const span = T[hi] - T[lo];
    return { i: lo, f: span > 0 ? (t - T[lo]) / span : 0 };
  }
  const lerp = (a, b, f) => a + (b - a) * f;
  function stateAt(t) {
    const { i, f } = sampleAt(t);
    const a = P[i], b = P[i + 1] || a;
    return {
      i,
      lon: lerp(a[0], b[0], f), lat: lerp(a[1], b[1], f),
      speed: lerp(a[3], b[3], f),
      limit: (f < 0.5 ? a : b)[4],
      ele: hasEle ? lerp(E[i], E[i + 1] ?? E[i], f) : null,
      dist: lerp(D[i], D[i + 1] ?? D[i], f),
    };
  }
  function pointAhead(i, dist, meters) {
    let j = i;
    while (j < P.length - 1 && D[j] < dist + meters) j++;
    return P[j];
  }

  // ---------- mapa (opcjonalna – doczytywana z internetu) ----------
  let map = null, mapReady = false, marker = null, is3D = true;
  let camBearing = null;
  const ORBIT_DEFAULT = { bearing: 0, pitch: 62 };
  const orbit = { ...ORBIT_DEFAULT };
  let twoFinger = false, lastTouch = null;
  const resetBtn = document.getElementById('resetView');
  const modeBtn = document.getElementById('mode');

  function routeGeoJSON() {
    const features = [];
    let cur = null;
    for (let i = 1; i < P.length; i++) {
      const c = cat(P[i]);
      if (!cur || cur.properties.cat !== c) {
        cur = { type: 'Feature', properties: { cat: c }, geometry: { type: 'LineString', coordinates: [[P[i - 1][0], P[i - 1][1]]] } };
        features.push(cur);
      }
      cur.geometry.coordinates.push([P[i][0], P[i][1]]);
    }
    return { type: 'FeatureCollection', features };
  }

  function loadLib(i) {
    if (window.maplibregl) return initMap();
    if (i >= LIBS.length) {
      setStatus(PREVIEW ? 'Bez mapy' : 'Brak mapy (nie udało się wczytać biblioteki) – widok uproszczony');
      return;
    }
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = LIBS[i] + '.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = LIBS[i] + '.js';
    js.onload = initMap;
    js.onerror = () => { console.warn('CDN niedostępny:', LIBS[i]); css.remove(); loadLib(i + 1); };
    document.head.appendChild(js);
  }

  function initMap() {
    setStatus(PREVIEW ? null : 'Ładowanie mapy…');
    try {
      const b = P.reduce((bb, p) => bb.extend([p[0], p[1]]), new maplibregl.LngLatBounds([P[0][0], P[0][1]], [P[0][0], P[0][1]]));
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        bounds: b,
        fitBoundsOptions: { padding: PREVIEW ? 28 : { top: 130, bottom: 210, left: 40, right: 40 } },
        maxPitch: 80,
        interactive: !PREVIEW,
        attributionControl: PREVIEW ? false : { compact: true },
        fadeDuration: PREVIEW ? 0 : 300,
      });
    } catch (e) {
      console.error('Mapa:', e);
      setStatus('Mapa niedostępna na tym telefonie (' + e.message + ') – widok uproszczony');
      return;
    }
    const slow = setTimeout(() => {
      if (!mapReady) setStatus(PREVIEW ? 'Bez mapy' : 'Mapa wczytuje się długo – brak internetu i brak tej okolicy w mapie offline. Widok uproszczony działa.');
    }, 15000);
    map.on('error', e => console.warn('Mapa:', e && e.error && e.error.message));
    map.on('load', () => {
      clearTimeout(slow);
      map.addSource('route', { type: 'geojson', data: routeGeoJSON() });
      map.addLayer({ id: 'route-casing', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 4, 15, 10] } });
      map.addLayer({ id: 'route', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': ['match', ['get', 'cat'], 'ok', COLORS.ok, 'c1', COLORS.c1, 'c2', COLORS.c2, 'c3', COLORS.c3, 'c4', COLORS.c4, COLORS.na],
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 2.5, 15, 6],
        } });

      // teren 3D – gdy się nie uda, zostaje zwykła mapa
      if (!PREVIEW) try {
        const DEM = {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          encoding: 'terrarium', tileSize: 256, maxzoom: 15,
          attribution: 'Teren: Mapzen / AWS Terrain Tiles',
        };
        map.addSource('dem', DEM);
        map.addSource('dem-shade', DEM);
        const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
        map.addLayer({ id: 'hillshade', type: 'hillshade', source: 'dem-shade',
          paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#3d3d3d' } }, firstSymbol);
        modeBtn.disabled = false;
      } catch (e) { console.warn('Teren 3D niedostępny:', e.message); }

      const carEl = document.createElement('div'); carEl.className = 'car';
      marker = new maplibregl.Marker({ element: carEl }).setLngLat([P[0][0], P[0][1]]);
      if (!PREVIEW) { marker.addTo(map); attachOrbitGestures(); }
      mapReady = true;
      c2d.style.display = 'none';
      setStatus(null);
      if (!modeBtn.disabled) set3D(true, false);
      if (!PREVIEW) render(tNow, playing);
    });
  }

  function set3D(on, animate = true) {
    if (!mapReady && animate) return;
    is3D = on;
    modeBtn.classList.toggle('on', on);
    try {
      if (on) {
        map.setTerrain({ source: 'dem', exaggeration: 1.5 });
        if (map.setSky) map.setSky({ 'sky-color': '#9cc7f0', 'horizon-color': '#e8eef5', 'sky-horizon-blend': 0.6 });
      } else {
        map.setTerrain(null);
      }
    } catch (e) { console.warn('3D:', e.message); }
    if (!playing && animate) map.easeTo({ pitch: on ? 55 : 0, duration: 800 });
  }
  modeBtn.onclick = () => set3D(!is3D);

  function followCamera(s, dt) {
    const target = bearing([s.lon, s.lat], pointAhead(s.i, s.dist, 120));
    if (camBearing == null) camBearing = target;
    const diff = ((target - camBearing + 540) % 360) - 180;
    camBearing = (camBearing + diff * (1 - Math.exp(-dt * 1.8)) + 360) % 360;
    const cam = { center: [s.lon, s.lat] };
    if (!twoFinger) {
      cam.bearing = camBearing + orbit.bearing;
      cam.pitch = is3D ? orbit.pitch : 0;
    }
    map.jumpTo(cam);
  }

  // 1 palec w trakcie odtwarzania: w bok = obrót wokół auta, w górę/dół = nachylenie
  function updateResetBtn() {
    const off = Math.abs(((orbit.bearing + 180) % 360) - 180) > 5 || Math.abs(orbit.pitch - ORBIT_DEFAULT.pitch) > 3;
    resetBtn.style.display = mapReady && playing && off ? 'block' : 'none';
  }
  resetBtn.onclick = () => { Object.assign(orbit, ORBIT_DEFAULT); updateResetBtn(); };

  function attachOrbitGestures() {
    const box = map.getCanvasContainer();
    box.addEventListener('touchstart', e => {
      twoFinger = e.touches.length >= 2;
      lastTouch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    }, { passive: true });
    box.addEventListener('touchmove', e => {
      if (!playing || e.touches.length !== 1 || !lastTouch) return;
      const t = e.touches[0];
      const dx = t.clientX - lastTouch.x, dy = t.clientY - lastTouch.y;
      lastTouch = { x: t.clientX, y: t.clientY };
      orbit.bearing = (orbit.bearing - dx * 0.4 + 360) % 360;
      if (is3D) orbit.pitch = Math.min(80, Math.max(0, orbit.pitch - dy * 0.25));
      updateResetBtn();
    }, { passive: true });
    box.addEventListener('touchend', e => {
      if (e.touches.length < 2 && twoFinger) {
        twoFinger = false;
        if (playing && camBearing != null) {
          orbit.bearing = (map.getBearing() - camBearing + 360) % 360;
          if (is3D) orbit.pitch = map.getPitch();
          updateResetBtn();
        }
      }
      lastTouch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    }, { passive: true });
  }

  // ---------- rysowanie klatki ----------
  const startMs = trip.startMs || 0;
  const clockAt = t => startMs
    ? new Date(startMs + t * 1000).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : hhmm(t);
  let tNow = 0;

  function render(t, follow, dtReal = 0) {
    tNow = t;
    const s = stateAt(t);
    hud.style.display = 'block';
    document.getElementById('hudSpeed').textContent = Math.round(s.speed);
    document.getElementById('limitSign').textContent = s.limit ?? '–';
    hud.classList.toggle('over', s.limit != null && s.speed > s.limit);
    document.getElementById('hudEle').textContent = s.ele != null ? `${Math.round(s.ele)} m n.p.m.` : '';
    document.getElementById('tNow').textContent = clockAt(t);
    document.getElementById('tDist').textContent = fmt(s.dist / 1000, 1) + ' / ' + fmt(totalD / 1000, 1) + ' km · ' + dur(t);
    document.getElementById('tEnd').textContent = clockAt(totalT);

    if (mapReady) {
      marker.setLngLat([s.lon, s.lat]);
      if (follow) followCamera(s, dtReal);
    } else {
      draw2D(s);
    }
    drawProfile(s.dist);
  }

  // ---------- odtwarzanie ----------
  let playing = false, factor = 60, lastFrame = 0;
  const playBtn = document.getElementById('play');

  function frame(ts) {
    if (!playing) return;
    const dt = lastFrame ? Math.min(0.1, (ts - lastFrame) / 1000) : 0;
    lastFrame = ts;
    let t = tNow + dt * factor;
    if (t >= totalT) { t = totalT; setPlaying(false); }
    render(t, true, dt);
    if (playing) requestAnimationFrame(frame);
  }

  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? '❚❚' : '▶';
    if (on) {
      if (tNow >= totalT) tNow = 0;
      camBearing = null; lastFrame = 0;
      if (mapReady) {
        map.dragPan.disable();
        if (Math.abs(map.getZoom() - 14.6) > 2.5) map.jumpTo({ zoom: is3D ? 14.6 : 14 });
      }
      requestAnimationFrame(frame);
    } else if (mapReady) {
      map.dragPan.enable();
    }
    updateResetBtn();
  }
  playBtn.onclick = () => setPlaying(!playing);

  const speedsEl = document.getElementById('speeds');
  SPEEDS.forEach(v => {
    const b = document.createElement('button');
    b.textContent = '×' + v;
    b.className = v === factor ? 'on' : '';
    b.onclick = () => { factor = v; [...speedsEl.children].forEach(c => c.classList.toggle('on', c === b)); };
    speedsEl.appendChild(b);
  });

  // ---------- profil wysokości (lub prędkości, gdy brak wysokości) ----------
  const cv = document.getElementById('profile');
  const ctx2 = cv.getContext('2d');
  const PROFILE = hasEle ? E : P.map(p => p[3]);
  const pMin = Math.min(...PROFILE), pMax = Math.max(...PROFILE);

  function drawProfile(cursorDist) {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (w < 10 || h < 10) return;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    const c = ctx2; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    const css = getComputedStyle(document.documentElement);
    const strip = 6, top = 14, bottom = h - strip - 4;
    const x = d => d / totalD * w;
    const y = v => bottom - (v - pMin) / Math.max(1, pMax - pMin) * (bottom - top);

    const grad = c.createLinearGradient(0, top, 0, bottom);
    grad.addColorStop(0, 'rgba(26,115,232,.45)'); grad.addColorStop(1, 'rgba(26,115,232,.05)');
    c.beginPath(); c.moveTo(0, bottom);
    const step = Math.max(1, Math.floor(PROFILE.length / (w * 2)));
    for (let i = 0; i < PROFILE.length; i += step) c.lineTo(x(D[i]), y(PROFILE[i]));
    c.lineTo(w, y(PROFILE[PROFILE.length - 1])); c.lineTo(w, bottom); c.closePath();
    c.fillStyle = grad; c.fill();
    c.beginPath();
    for (let i = 0; i < PROFILE.length; i += step) (i ? c.lineTo : c.moveTo).call(c, x(D[i]), y(PROFILE[i]));
    c.strokeStyle = css.getPropertyValue('--accent'); c.lineWidth = 1.5; c.stroke();

    for (let i = 1; i < P.length; i++) {
      c.fillStyle = COLORS[cat(P[i])];
      c.fillRect(x(D[i - 1]), h - strip, Math.max(1, x(D[i]) - x(D[i - 1]) + 0.5), strip);
    }

    c.fillStyle = css.getPropertyValue('--muted'); c.font = '11px system-ui, sans-serif';
    const unit = hasEle ? ' m' : ' km/h';
    c.fillText((hasEle ? 'Wysokość ' : 'Prędkość ') + fmt(pMax) + unit, 2, 10);
    c.textAlign = 'right'; c.fillText('min ' + fmt(pMin) + unit, w - 2, 10); c.textAlign = 'left';

    const cx = x(cursorDist);
    c.strokeStyle = css.getPropertyValue('--fg'); c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, top - 2); c.lineTo(cx, h); c.stroke();
  }

  function scrub(e) {
    const r = cv.getBoundingClientRect();
    const d = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * totalD;
    let i = 0; while (i < D.length - 1 && D[i] < d) i++;
    seek(T[i]);
  }
  function seek(t) {
    if (playing) setPlaying(false);
    render(t, false);
  }
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); scrub(e); });
  cv.addEventListener('pointermove', e => { if (e.buttons) scrub(e); });
  function relayout() {
    try { placeOverlays(); layout2D(); render(tNow, playing); } catch (e) { console.error('relayout', e); }
  }
  window.addEventListener('resize', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(document.body);

  // start: mapa doczytuje się w tle, a w tym czasie działa widok uproszczony
  window.__uiReady = true;
  loadLib(0);
  relayout();
}
</script>
</body>
</html>
